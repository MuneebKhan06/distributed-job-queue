global:
  scrape_interval: 10s

scrape_configs:
  - job_name: job-queue-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: job-queue-workers
    # DNS service discovery rather than a static list: worker replicas have no
    # fixed hostnames, and compose resolves the service name to every replica's
    # address, so scaling up does not need this file edited.
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
