# Included by the server block and again by every location that sets its own
# headers: nginx drops inherited add_header lines in any block that has one
# of its own, so a server level line alone would miss the assets and
# index.html.

# The dashboard has buttons that replay jobs, so another site must not be able
# to frame it and trick a click onto one.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
# Job IDs sit in the URL. They are not secret, but there is no reason to hand
# them to any site a link leads to.
add_header Referrer-Policy "same-origin" always;
