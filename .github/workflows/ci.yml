name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the Docker images run. 3.10 is here because the code
        # deliberately stays compatible with it, which is also what ruff's
        # target-version claims. Without a 3.10 job that claim would drift
        # untested until someone tried to run it.
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app/ worker/ tests/ load_tests/ scripts/ alembic/

      - name: Unit tests
        # Integration tests are excluded here and run in their own job, which
        # has the services they need. Left in, they would fail on a missing
        # Redis rather than on anything about the code.
        run: pytest tests/ -m "not integration"

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    # Real Redis and PostgreSQL, because the whole value of these tests is
    # catching the wiring that mocks agree to no matter what it says.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobqueue
          POSTGRES_PASSWORD: jobqueue
          POSTGRES_DB: jobqueue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobqueue -d jobqueue_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: jobqueue_test
        run: alembic upgrade head

      - name: Integration tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: jobqueue_test
          REDIS_HOST: localhost
        run: pytest tests/ -m integration -v

  dashboard:
    name: Dashboard format, type check, tests and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version the dashboard image builds with.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it fails if package-lock.json and package.json
      # disagree, rather than quietly resolving something new.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # build runs tsc as well, but on its own the type check fails with a
      # clearer message than a failed bundle does.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Builds the image without pushing it, so a broken Dockerfile or nginx
      # template fails here rather than on someone's docker compose up.
      - name: Build the dashboard image
        working-directory: .
        run: docker build -f docker/Dockerfile.dashboard -t job-queue-dashboard:ci .
